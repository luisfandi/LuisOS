<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
  
    <title>LUIS_OS // CORE v2.7</title>
<style>
    /* Forzamos que todos los inputs se vean Stark */
/* Esto va dentro de <style> */
input[type="text"], 
input[type="password"], 
input[type="date"],
textarea,
button {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
    font-size: 1rem !important;
    letter-spacing: 0.5px;
    padding: 12px 15px !important; /* Para que no se vea pegado al borde */
}

/* Específicamente para que el placeholder no se vea mal */
::placeholder {
    font-family: 'Segoe UI', sans-serif;
    opacity: 0.5;
    font-size: 0.9rem;
}

/* Específicamente para Fechas Importantes que se ve blanco */
#imp-title, #imp-date {
    background-color: var(--surface) !important;
    color: var(--text) !important;
}
    #boot-terminal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    color: #00ffcc;
    font-family: 'Courier New', monospace;
    display: none; 
    z-index: 10000; /* Aseguramos que esté por encima de TODO */
    padding: 100px;
    box-sizing: border-box;
    text-shadow: 0 0 5px #00ffcc;
    flex-direction: column;
    justify-content: center; /* Centra las líneas verticalmente */
}

#terminal-content {
    font-size: 1.2rem;
    line-height: 1.5;
    white-space: pre-wrap;
}

/* Efecto de línea de escaneo moviéndose */
#scan-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(0, 255, 204, 0.2);
    box-shadow: 0 0 10px #00ffcc;
    animation: scan 4s linear infinite;
}

@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}
    :root { 
        --bg: #050505; --surface: #070707; --panel: #0a111a;
        --text: #ffffff; --text-dim: #555;
        --primary: #007BFF; --primary-glow: rgba(0, 123, 255, 0.4);
        --gray: #222; --progress-w: 0%; --dyn-color: var(--primary);
    }

    /* CONFIGURACIÓN DE TEMAS */
    body.theme-light { --bg: #f5f6f7; --surface: #ffffff; --panel: #eef2f7; --text: #1a1a1a; --text-dim: #888; --primary: #0056b3; --primary-glow: rgba(0, 86, 179, 0.2); --gray: #ddd; }
    body.theme-matrix { --bg: #000; --surface: #050505; --panel: #001100; --text: #00FF41; --text-dim: #004400; --primary: #00FF41; --primary-glow: rgba(0, 255, 65, 0.3); --gray: #002200; }
    body.theme-dracula { --bg: #282a36; --surface: #44475a; --panel: #383a59; --text: #f8f8f2; --text-dim: #6272a4; --primary: #bd93f9; --primary-glow: rgba(189, 147, 249, 0.3); --gray: #444; }
    body.theme-cyberpunk { --bg: #13002c; --surface: #2d005e; --panel: #4a007d; --text: #00ff9f; --text-dim: #f3f315; --primary: #ff0055; --primary-glow: rgba(255, 0, 85, 0.4); --gray: #222; }
    body.theme-oled { --bg: #000000; --surface: #0a0a0a; --panel: #111111; --text: #ffffff; --text-dim: #333; --primary: #ffffff; --primary-glow: rgba(255, 255, 255, 0.2); --gray: #222; }

    /* Arreglos OLED */
    body.theme-oled .add-btn { background: none; border: 1px solid #fff; color: #fff; }
    body.theme-oled input[type="text"] { border: 1px solid #333; }
    body.theme-oled input[type="text"]:focus { border-color: #fff; }

    * { box-sizing: border-box; transition: background 0.2s, color 0.2s; }
    html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100%; width: 100%; overflow: hidden; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--primary); }

    #login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .login-input { width: 350px; background: var(--surface); border: 1px solid var(--gray); padding: 15px; color: var(--text); text-align: center; font-size: 1.5rem; font-family: monospace; outline: none; }

    /* ESTRUCTURA CORE */
    .app-shell { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: grid; grid-template-rows: 65px 1fr; grid-template-columns: 280px 1fr; }
    
    header { grid-column: 1 / 3; background: #000; padding: 0 30px; border-bottom: 1px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10; }
    #clock { font-family: monospace; color: var(--primary); font-size: 1.8rem; font-weight: 900; text-shadow: 0 0 10px var(--primary-glow); }

    aside { grid-row: 2 / 3; background: var(--bg); border-right: 1px solid var(--primary); padding: 25px; display: flex; flex-direction: column; }
    .nav-group { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
   .nav-btn { 
            background: none; 
            border: none; 
            color: #888; /* <-- Acá subimos el brillo del gris oscuro a uno medio */
            text-align: left; 
            font-family: monospace; 
            cursor: pointer; 
            font-size: 0.9rem; /* <-- Le subimos un pelín el tamaño */
            font-weight: bold; /* <-- NEGRILLA PARA TODOS */
            letter-spacing: 1px; /* <-- Espacio entre letras para que sea más legible */
            text-transform: uppercase; 
            padding: 12px 0; /* <-- Un poco más de espacio arriba y abajo */
            border-left: 3px solid transparent; 
            transition: all 0.2s ease; /* Transición suave al pasar el mouse */
        }
        .nav-btn:hover:not(.active) {
            color: #ccc; /* Se pone casi blanco al pasar el mouse */
            border-left: 3px solid rgba(255, 255, 255, 0.2);
        }
    .nav-btn.active { color: var(--primary); font-weight: bold; border-left: 3px solid var(--primary); padding-left: 15px; }

  #theme-menu { 
        display: none; 
        position: absolute; 
        top: 35px; 
        left: 0; 
        background: #000; /* Fondo negro sólido para que se vea siempre */
        border: 1px solid var(--primary); 
        padding: 10px; 
        flex-direction: column; 
        gap: 8px; 
        z-index: 1000; 
        width: 160px; 
        box-shadow: 0 10px 30px rgba(0,0,0,1); 
    }

    #theme-menu .nav-btn {
        padding: 8px;
        font-size: 0.75rem;
        border-bottom: 1px solid #222;
        color: #fff !important; /* Forzamos blanco para que se lea en el panel */
    }

    #theme-menu .nav-btn:hover {
        background: var(--primary);
        color: #000 !important;
    }
    .exit-btn { background: none; border: 1px solid var(--gray); color: var(--text-dim); padding: 8px; font-family: monospace; cursor: pointer; width: 100%; margin-top: auto; font-size: 0.75rem; }

    main { grid-row: 2 / 3; padding: 40px; overflow-y: auto; display: flex; justify-content: center; background: radial-gradient(circle at center, var(--panel) 0%, var(--bg) 100%); }
    .content-container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; }
    
    .section-title { font-size: 3.5rem; font-style: italic; font-weight: 900; line-height: 1; text-transform: uppercase; margin-bottom: 20px; letter-spacing: -1px; }
    .title-wrapper { display: flex; align-items: baseline; gap: 25px; margin-bottom: 30px; }
    #random-phrase { font-size: 1.4rem; font-weight: bold; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); transition: opacity 0.5s; white-space: nowrap; }
    .phrase-glitch { animation: glitch 0.3s ease-in-out; }
    @keyframes glitch { 0% { transform: translateX(-5px); opacity: 0; } 50% { transform: translateX(5px); opacity: 0.5; } 100% { transform: translateX(0); opacity: 1; } }

    .item-row { background: var(--surface); padding: 15px 25px; border: 1px solid var(--gray); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 4px solid transparent; }
    .item-row:hover { border-left-color: var(--primary); }
    
    input[type="text"], input[type="date"], textarea { background: var(--surface); border: 1px solid var(--gray); color: var(--text); padding: 12px; outline: none; font-family: monospace; font-size: 1.1rem; }
    .add-btn { background: var(--primary); border: none; color: #fff; padding: 0 30px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; }

    /* --- LOGS / HISTORIAL (REPARADO) --- */
    .history-card { background: var(--surface); padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--card-color); border-top: 1px solid var(--gray); border-right: 1px solid var(--gray); border-bottom: 1px solid var(--gray); }
    .hist-item { font-family: monospace; font-size: 0.95rem; margin: 5px 0; display: flex; align-items: center; gap: 8px; color: var(--text); }
    /* Contenedor de dos columnas para los hábitos en el historial */
    .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    /* BITÁCORA */
    #word-editor { width: 100%; height: 50vh; resize: none; font-size: 1.25rem; line-height: 1.6; }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(39%) sepia(86%) saturate(1900%) hue-rotate(190deg) brightness(100%) contrast(105%);
        cursor: pointer;
    }

    .hidden { display: none !important; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; }
    
    .progress-container { position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--gray); }
    .progress-bar { height: 100%; width: var(--progress-w); background: var(--dyn-color); transition: 0.8s ease; }
    /* ESTILOS PARA LA SECCIÓN INFORMES */
#informes-list {
    margin-top: 20px;
    max-height: 400px;
    overflow-y: auto; /* Para que si tenés muchos, puedas scrollear */
}

.data-item {
    background: rgba(10, 10, 10, 0.8);
    border: 1px solid var(--gray);
    padding: 15px;
    margin-bottom: 15px;
    position: relative;
}

.data-item:hover {
    border-color: var(--primary);
}

.data-header {
    border-bottom: 1px dashed var(--gray);
    padding-bottom: 5px;
    margin-bottom: 10px;
}

.delete-btn {
    background: transparent;
    color: #ff4444;
    border: 1px solid #ff4444;
    cursor: pointer;
    font-size: 0.7rem;
    padding: 2px 5px;
    margin-top: 10px;
}

.delete-btn:hover {
    background: #ff4444;
    color: white;
}
</style>

  <script>
        const fs = require('fs');
        const path = require('path');
        
        const dbPath = path.join(process.env.USERPROFILE || process.env.HOME, 'LUIS_OS_DATABASE.json');

        let db, currentEditingDate = "";
        
        const frasesNuevas = [
            "¿YA HUBO QUILOMBO EN EL GRUPO DE PDE?",
            "¿SE VOLVIERON A PELEAR CASCARDO Y VOLPA?",
            "¿QUÉ ONDA CON LUD?",
            "PONETE A ESTUDIAR PAJERO",
            "ANDÁ AL GYM",
            "AMO A MI MAMÁ",
            "PODRÍAS COCINAR CADA TANTO",
            "LEETE PADRE RICO PADRE POBRE",
            "AMO A LAS MUJERES",
            "¿QUE COVER SE VIENE PARA EL VIERNES?",
            "UPTOWN?",
            "VIERNES ASADO PILETA IMA",
            "BOCA BOOCAAA",
            "buen intento ramardo",
            "¿AURA?",
            "cojer en big 2026",
            "tarán",

        ];

        function loadFromDisk() {
            if (!fs.existsSync(dbPath)) {
                const initial = { habits: [], bitacora: {}, pass: null, history: [], importantDates: [], theme: 'dark' };
                fs.writeFileSync(dbPath, JSON.stringify(initial, null, 2));
                return initial;
            }
            return JSON.parse(fs.readFileSync(dbPath, 'utf8'));
        }

        function saveToDisk() {
            fs.writeFileSync(dbPath, JSON.stringify(db, null, 2));
        }

        db = loadFromDisk();
if (!db.agendaText) db.agendaText = "";
        window.toggleThemeMenu = function() {
            const menu = document.getElementById('theme-menu');
            menu.style.display = (menu.style.display === 'none' || menu.style.display === '') ? 'flex' : 'none';
        }

        window.setTheme = function(theme) {
            document.body.classList.remove('theme-dark', 'theme-light', 'theme-matrix', 'theme-dracula', 'theme-cyberpunk', 'theme-oled');
            document.body.className = 'theme-' + theme;
            db.theme = theme;
            saveToDisk();
            const menu = document.getElementById('theme-menu');
            if(menu) menu.style.display = 'none';
        }

        setTheme(db.theme || 'dark');

        function updateProgressUI(perc) {
            let color = "#8B0000"; 
            if (perc > 30) color = "#D2691E"; 
            if (perc > 60) color = "#DAA520"; 
            if (perc > 90) color = "#00FF41"; 
            document.documentElement.style.setProperty('--progress-w', perc + '%');
            document.documentElement.style.setProperty('--dyn-color', color);
            document.getElementById('progress-text').style.color = color;
        }

    // --- SISTEMA DE AUDIO Y BOOTEO JARVIS ---
        function speak() {
            try {
                // Usamos el protocolo static que configuramos en el index.ts
                const jarvis = new Audio('static://welcome.mp3');
                jarvis.volume = 1;
                
                jarvis.play().catch(err => {
                    console.log("Autoplay bloqueado. Esperando interacción...");
                    // Si falla, se activará al primer click del usuario
                    document.addEventListener('click', () => { jarvis.play(); }, { once: true });
                });
            } catch (e) {
                console.error("Error en el sistema de audio:", e);
            }
        }

        const bootLines = [
            "> INITIALIZING BIOMETRIC SCAN...",
            "> CONNECTION ESTABLISHED: ENCRYPTED_CHANNEL_07",
            "> ANALYZING RETINA PATTERN...",
            "> ACCESS GRANTED: LUIS JULIÁN FANDIÑO",
            "> LOADING LUIS_OS CORE v2.7...",
            "> MOUNTING SYSTEM MODULES...",
            "> CHECKING PENDING OBJECTIVES...",
            "> Jarvis.ai: ONLINE",
            "> WELCOME BACK, SIR."
        ];

        function startIntro() {
            const terminal = document.getElementById('boot-terminal');
            const content = document.getElementById('terminal-content');
            terminal.style.display = 'block';
            
            // Disparamos el audio
            speak(); 

            let i = 0;
            function typeLine() {
                if (i < bootLines.length) {
                    content.innerHTML += bootLines[i] + "<br>";
                    i++;
                    // 1500ms para que las líneas vayan al compás de un audio de 17s
                    setTimeout(typeLine, 1500); 
                } else {
                    setTimeout(() => {
                        terminal.style.transition = "opacity 1.5s";
                        terminal.style.opacity = "0";
                        setTimeout(() => {
                            terminal.style.display = 'none';
                        }, 1500);
                    }, 2000);
                }
            }
            typeLine();
        }

        // --- SISTEMA DE LOGIN ---
        window.checkLogin = function() {
            const field = document.getElementById('pass-field');
            const val = btoa(field.value);
            
            // 'db.pass' debe estar configurado en tu JSON o podes usar un string fijo para probar
            if (val === db.pass || field.value === "tu_clave_aca") { 
                document.getElementById('login-overlay').style.display = 'none'; 
                render(); 
                setBitacoraToday(); 
                renderImportant();  
                startPhraseTicker();

                // DISPARAMOS LA INTRO CINEMÁTICA
                startIntro(); 

            } else { 
                field.value = ""; 
                alert("ACCESS DENIED");
            }
        }
        function startPhraseTicker() {
            const el = document.getElementById('random-phrase');
            const change = () => {
                if(!el) return;
                el.style.opacity = 0;
                el.classList.remove('phrase-glitch');
                setTimeout(() => {
                    const pick = frasesNuevas[Math.floor(Math.random() * frasesNuevas.length)];
                    el.innerText = `// ${pick}`;
                    el.style.opacity = 1;
                    el.classList.add('phrase-glitch');
                }, 500);
            };
            change(); 
            setInterval(change, 10000); 
        }

        window.addHabit = function() {
            const input = document.getElementById('habit-input');
            if(!input.value) return;
            db.habits.push({ id: Date.now(), text: input.value.toUpperCase(), done: false, date: new Date().toLocaleDateString() });
            saveToDisk(); input.value = ''; render();
        }

        window.toggleHabit = function(id) {
            db.habits = db.habits.map(h => h.id === id ? {...h, done: !h.done} : h);
            saveToDisk(); render();
        }

        window.deleteHabit = function(id) {
            db.habits = db.habits.filter(h => h.id !== id);
            saveToDisk(); render();
        }

        window.archiveDay = function() {
            const todayStr = new Date().toLocaleDateString();
            if(db.history.some(h => h.date === todayStr)) return alert("¡YA COMPLETASTE TUS HÁBITOS DE HOY!");
            const todayHabits = db.habits.filter(h => h.date === todayStr);
            if(!todayHabits.length) return alert("NADA QUE ARCHIVAR.");
            if(!confirm("¿CERRAR JORNADA?")) return;
            db.history.push({ date: todayStr, habits: JSON.parse(JSON.stringify(todayHabits)) });
            db.habits = db.habits.map(h => ({ ...h, done: false }));
            saveToDisk(); render();
        }

        window.clearAllLogs = function() {
            if(!confirm("¿BORRAR TODO EL HISTORIAL?")) return;
            db.history = [];
            saveToDisk(); renderHistory();
        }

      window.render = function() {
    const todayStr = new Date().toLocaleDateString();
    const dateEl = document.getElementById('current-date-habit');
    if(dateEl) dateEl.innerText = todayStr.toUpperCase();
    
    const list = document.getElementById('list-today');
    if(!list) return;
    
    list.innerHTML = '';
    const todayHabits = db.habits.filter(h => h.date === todayStr);
    const comp = todayHabits.filter(h => h.done).length;
    const total = todayHabits.length;
    const perc = total ? Math.round((comp/total)*100) : 0;
    
    updateProgressUI(perc);
    document.getElementById('progress-text').innerText = `${perc}% COMPLETE (${comp}/${total})`;
    
   todayHabits.forEach(h => {
        list.innerHTML += `
            <div class="item-row">
                <span class="item-text" style="opacity: ${h.done ? '0.3' : '1'}">${h.text}</span>
                <div style="display:flex; gap:15px; align-items:center;">
                    <input type="checkbox" ${h.done?'checked':''} onchange="toggleHabit(${h.id})">
                    <span onclick="deleteHabit(${h.id})" style="cursor:pointer; opacity:0.1; font-size:1.1rem;">🗑️</span>
                </div>
            </div>`;
    });
    
    renderHome(); 
}
        const editor = document.getElementById('word-editor');
        editor.addEventListener('input', () => {
            if(!currentEditingDate) return;
            db.bitacora[currentEditingDate] = btoa(unescape(encodeURIComponent(editor.value)));
            saveToDisk();
        });
        // Guardado automático de la Agenda
const agendaEditor = document.getElementById('agenda-editor');
agendaEditor.value = db.agendaText || "";
agendaEditor.addEventListener('input', () => {
    db.agendaText = agendaEditor.value;
    saveToDisk();
});

        window.setBitacoraToday = function() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('bitacora-date-picker').value = formatted;
            switchBitacoraCustom(formatted);
        }

        window.switchBitacoraCustom = function(dateVal) {
            if(!dateVal) return;
            const [y, m, d] = dateVal.split('-');
            const dateKey = `${parseInt(d)}/${parseInt(m)}/${y}`;
            currentEditingDate = dateKey;
            editor.readOnly = false;
            editor.disabled = false;
            editor.style.pointerEvents = "auto";
            const raw = db.bitacora[dateKey] || "";
            try { editor.value = raw ? decodeURIComponent(escape(atob(raw))) : ""; } catch (e) { editor.value = raw ? atob(raw) : ""; }
        }

        window.renderHistory = function() {
            const histList = document.getElementById('list-yesterday');
            histList.innerHTML = '';
            [...db.history].reverse().forEach(day => {
                const comp = day.habits.filter(h => h.done).length;
                const total = day.habits.length;
                const perc = total ? Math.round((comp/total)*100) : 0;
                let hColor = perc > 80 ? "#00FF41" : (perc > 40 ? "#DAA520" : "#8B0000");
                let dayHtml = `
                    <div class="history-card" style="--card-color: ${hColor}">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <div style="font-weight:bold; font-size:1.1rem;">${day.date}</div>
                            <div style="color:${hColor}; font-size:0.85rem;">${perc}%</div>
                        </div>
                        <div class="history-grid">`;
                day.habits.forEach(h => { 
                    dayHtml += `<div class="hist-item" style="opacity:${h.done?'1':'0.2'}">${h.done?'[✔]':'[✖]'} ${h.text}</div>`; 
                });
                histList.innerHTML += dayHtml + `</div></div>`;
            });
        }

        window.addImportantDate = function() {
            const date = document.getElementById('imp-date').value;
            const title = document.getElementById('imp-title').value.toUpperCase();
            if(!date || !title) return;
            db.importantDates.push({ date, title });
            saveToDisk(); renderImportant();
        }

        function renderImportant() {
            const list = document.getElementById('list-important');
            list.innerHTML = '';
            db.importantDates.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                const [y, m, d] = item.date.split('-');
                list.innerHTML += `<div class="item-row"><span style="color:var(--primary); font-weight:bold;">${d}/${m}/${y}</span><span class="item-text">${item.title}</span><button onclick="jumpToDate('${item.date}')" style="background:none; border:1px solid var(--gray); color:var(--text-dim); padding:5px 10px; cursor:pointer; font-family:monospace; font-size:0.7rem;">VER</button></div>`;
            });
        }


        window.jumpToDate = function(date) {
            document.getElementById('bitacora-date-picker').value = date;
            switchBitacoraCustom(date);
            showTab('word', document.querySelectorAll('.nav-btn')[2]);
        }
        window.renderHome = function() {
    // Calculo Objetivos
    const todayStr = new Date().toLocaleDateString();
    const todayHabits = (db.habits || []).filter(h => h.date === todayStr);
    const comp = todayHabits.filter(h => h.done).length;
    const tot = todayHabits.length;
    document.getElementById('home-obj-status').innerText = tot === 0 ? "SIN OBJETIVOS REGISTRADOS" : `PROGRESO: ${comp} / ${tot}`;

    // Calculo Próximo Evento
    const dateStatus = document.getElementById('home-date-status');
    if (!db.importantDates || db.importantDates.length === 0) {
        dateStatus.innerText = "SIN EVENTOS PROGRAMADOS";
    } else {
        const sorted = [...db.importantDates].sort((a,b) => new Date(a.date) - new Date(b.date));
        const todayReverse = todayStr.split('/').reverse().join('-');
        const next = sorted.find(d => new Date(d.date) >= new Date(todayReverse));
        if (next) {
            const [y, m, d] = next.date.split('-');
            dateStatus.innerHTML = `<span style="color:#fff">${d}/${m}/${y}</span> - ${next.title}`;
        } else {
            dateStatus.innerText = "NO HAY EVENTOS FUTUROS";
        }
    }
}

   window.showTab = function(tab, btn) {
    // Ocultamos todas las pestañas
    ['home', 'habits', 'word', 'agenda', 'important'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        if(el) el.classList.add('hidden');
    });
    
    // Mostramos la elegida
    document.getElementById('tab-' + tab).classList.remove('hidden');
    
    // Actualizamos los botones del menú
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    
    // Renderizados específicos
    if (tab === 'home') renderHome();      // <--- Agregamos esta
    if (tab === 'habits') renderHistory(); 
    if (tab === 'important') renderImportant();
}

        let lastCheckDate = new Date().toLocaleDateString();
        setInterval(() => {
            const now = new Date();
            const currentDate = now.toLocaleDateString();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            if (currentDate !== lastCheckDate) {
                lastCheckDate = currentDate;
                render(); 
                setBitacoraToday();
            }
        }, 1000);

        startPhraseTicker();
     



    </script>
</body>
</html>
